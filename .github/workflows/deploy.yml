name: Security-First CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: lab-repo-ac643e5v
  ECS_CLUSTER: cmtr-ac643e5v-ecs_cluster
  ECS_SERVICE: cmtr-ac643e5v-ecs_service

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
          # Extract the image digest for Inspector scanning
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_URI | cut -d'@' -f2)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV
          echo "Pushed image with digest: $IMAGE_DIGEST"

      - name: Wait for Inspector Scan and Enforce Security Gate
        run: |
          echo "Fetching image digest directly from AWS ECR..."
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text)
            
          echo "Target Image Digest: $IMAGE_DIGEST"
          
          # Poll Amazon Inspector for up to 3 minutes
          for i in {1..12}; do
            echo "Attempt $i: Querying Inspector for Critical CVEs..."
            CRITICAL_COUNT=$(aws inspector2 list-findings \
              --filter-criteria '{"ecrImageHash": [{"comparison": "EQUALS", "value": "'"$IMAGE_DIGEST"'"}], "severity": [{"comparison": "EQUALS", "value": "CRITICAL"}]}' \
              --query 'findings | length')
              
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "SECURITY GATE FAILED: $CRITICAL_COUNT Critical vulnerabilities detected. Deployment blocked."
              exit 1
            fi
            
            echo "No critical vulnerabilities found yet. Waiting 15 seconds..."
            sleep 15
          done
          
          echo "SECURITY GATE PASSED: No Critical vulnerabilities found after 3 minutes."

      - name: Deploy to AWS Fargate
        run: |
          echo "Forcing new ECS deployment to pull the latest secure image..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment